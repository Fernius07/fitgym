{% extends "base.html" %}

{% block titulo %}Ejercicios - FitGym &amp; Workout{% endblock %}

{% block contenido %}
<h2>Lista de ejercicios</h2>
{% if lista_ejercicios %}
    <ul>
    {% for e in lista_ejercicios %}
        <li><a href="{% url 'ejercicio' e.id %}">{{ e.nombre }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No hay ejercicios creados.</p>
{% endif %}
{% endblock %}
